name: Orvala published Mac native client QA

# Generic QA orchestration only. No Apple secret, private game source, cache or
# Actions artifact is used. This workflow never signs or republishes the game.
on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: Independently approved SHA-256 of own v1.0.4 macos-arm64.json
        required: true
        type: string
      confirm_version:
        description: Type 1.0.4 to test only the already-published own package
        required: true
        type: string
        default: '1.0.4'
      runner_image:
        description: Standard public ARM64 runner; never a larger paid runner
        required: true
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
      publish_evidence:
        description: Add unique QA images/logs/JSON to existing own v1.0.4 pre-release only after PASS
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orvala-mac-native-client-104
  cancel-in-progress: false

jobs:
  native-client:
    if: >-
      github.repository == 'DaneAz61/orvala-releases' && inputs.confirm_version == '1.0.4' &&
      (inputs.runner_image == 'macos-26' || inputs.runner_image == 'macos-15')
    runs-on: ${{ inputs.runner_image }}
    timeout-minutes: 8
    permissions:
      contents: write # Built-in token enters ONLY the separate QA asset upload step.
    env:
      QA_MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
      ORVALA_QA_RUNNER_IMAGE: ${{ inputs.runner_image }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out generic distribution and verification helpers only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            deployment/build-macos/cloud_release.py
            deployment/build-macos/verify_published_macos.py
          sparse-checkout-cone-mode: false
      - name: Audit offline fixtures and exact public download plan
        run: |
          python3 deployment/build-macos/verify_published_macos.py --self-test
          python3 deployment/build-macos/verify_published_macos.py --plan --manifest-sha256 "$QA_MANIFEST_SHA"
      - name: Reserve exclusive disposable QA workspace
        env:
          ORVALA_HOSTED_QA: ${{ runner.environment }}
        run: |
          test "$ORVALA_HOSTED_QA" = github-hosted
          echo "ORVALA_HOSTED_QA=$ORVALA_HOSTED_QA" >> "$GITHUB_ENV"
          echo "ORVALA_CLIENT_QA_DIR=$RUNNER_TEMP/orvala-mac-native-client-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Reextract, trust and run credential-free native client checks
        run: >-
          python3 deployment/build-macos/verify_published_macos.py
          --run --manifest-sha256 "$QA_MANIFEST_SHA"
          --work-dir "$ORVALA_CLIENT_QA_DIR"
      - name: Upload only unique validated QA evidence to own existing pre-release
        if: success() && inputs.publish_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 deployment/build-macos/verify_published_macos.py
          --publish-evidence --manifest-sha256 "$QA_MANIFEST_SHA"
          --work-dir "$ORVALA_CLIENT_QA_DIR"
      - name: Record explicit safe outcome and validation limits
        if: always() && env.ORVALA_CLIENT_QA_DIR != ''
        run: |
          if test -f "$ORVALA_CLIENT_QA_DIR/public/evidence.json"; then
            python3 deployment/build-macos/verify_published_macos.py --report \
              --manifest-sha256 "$QA_MANIFEST_SHA" --work-dir "$ORVALA_CLIENT_QA_DIR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Native GUI/client QA was not completed. No visual/gameplay approval is implied.' >> "$GITHUB_STEP_SUMMARY"
          fi
